name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install scanners
        run: pip install bandit semgrep
      - name: Bandit
        run: bandit -r src generator dags -ll
      - name: Semgrep
        run: semgrep --config .semgrep.yml --metrics=off --error src generator dags
      - name: Check accepted exceptions
        run: python3 scripts/check_security_exceptions.py security/exceptions.json

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan history and tree
        run: |
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
          ./gitleaks dir --config .gitleaks.toml --redact --no-banner .

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit locked app dependencies
        run: pip-audit -r requirements/app.lock --no-deps --disable-pip
      - name: Audit locked dbt dependencies
        run: pip-audit -r requirements/dbt.lock --no-deps --disable-pip

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP" v0.69.3
      - name: Source SBOM (CycloneDX)
        run: |
          # Trivy reads files named requirements.txt, so copy the two lock files.
          mkdir -p sbom-in/app sbom-in/dbt
          cp requirements/app.lock sbom-in/app/requirements.txt
          cp requirements/dbt.lock sbom-in/dbt/requirements.txt
          "$RUNNER_TEMP/trivy" fs --format cyclonedx --output sbom-source.cdx.json sbom-in
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-source
          path: sbom-source.cdx.json
